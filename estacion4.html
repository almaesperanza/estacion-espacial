<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación 4: Cápsula del Tiempo 🌌</title>
    <!-- Librería jsPDF para generar PDFs desde el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-color: #04060f;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Canvas de estrellas de fondo */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Encabezado Espacial */
        .header-station {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        h1 {
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.6rem;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
            margin: 0;
        }
        p.subtitle {
            color: #f472b6;
            font-size: 0.85rem;
            margin-top: 4px;
            font-family: 'Courier New', Courier, monospace;
        }

        /* BOTÓN DE ABRIR CÁPSULA (PANTALLA INICIAL) */
        .unlock-box {
            position: relative;
            z-index: 10;
            text-align: center;
            transition: all 0.5s ease;
            margin-top: 30px;
        }

        .capsule-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: capsuleFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #38bdf8);
        }

        @keyframes capsuleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(-4deg); }
        }

        .btn-open-capsule {
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            color: #0b0f19;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
        }

        .btn-open-capsule:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.9);
        }

        /* CONTENEDOR PRINCIPAL DE LA CÁPSULA */
        .wishes-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 80px;
            display: none;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wishes-container.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* Formulario para agregar deseo */
        .wish-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: rgba(4, 12, 24, 0.8);
            border: 1px solid #f472b6;
            border-radius: 12px;
            color: #a7f3d0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 0.9rem;
            outline: none;
            box-shadow: inset 0 0 10px rgba(244, 114, 182, 0.2);
        }

        textarea::placeholder {
            color: rgba(167, 243, 208, 0.5);
        }

        .btn-action {
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            color: #0b0f19;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.8);
        }

        .btn-download {
            background: transparent;
            border: 1px dashed #38bdf8;
            color: #38bdf8;
            padding: 8px;
            font-size: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-download:hover {
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* NOTA ESPECIAL ESPACIAL */
        .future-note {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.82rem;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.4;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        /* Historial de Deseos */
        .history-title {
            color: #f472b6;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            border-bottom: 1px dashed rgba(244, 114, 182, 0.4);
            padding-bottom: 6px;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .wishes-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .wish-card {
            background: rgba(4, 12, 24, 0.6);
            border-left: 3px solid #22d3ee;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .wish-year {
            color: #f472b6;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .wish-text {
            color: #e2e8f0;
            white-space: pre-line;
        }

        /* Scrollbar Neón */
        .wishes-list::-webkit-scrollbar {
            width: 4px;
        }
        .wishes-list::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 10px;
        }

        /* Botón Siguiente Estación */
        .next-station {
            position: fixed;
            bottom: 20px;
            z-index: 10;
            display: none;
        }

        .btn-next {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 10px 25px;
            font-size: 0.9rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s;
        }

        .btn-next:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="header-station">
        <h1>🌌 CÁPSULA DEL TIEMPO 🌌</h1>
        <p class="subtitle">[ Registro de Deseos Intergalácticos ]</p>
    </div>

    <!-- BOTÓN INICIAL PARA ABRIR LA CÁPSULA -->
    <div class="unlock-box" id="unlockBox">
        <div class="capsule-icon">🛸⏳</div>
        <button class="btn-open-capsule" onclick="openCapsule()">ABRIR CÁPSULA DEL TIEMPO ✨</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL QUE SE REVELA -->
    <div class="wishes-container" id="wishesContainer">
        
        <!-- MENSAJE DE EXPECTATIVA/TRADICIÓN -->
        <div class="future-note">
            ✨ <strong>[ AVISO DEL SISTEMA ESPACIAL ]</strong><br>
            Esta cápsula quedará orbitando en el espacio. El próximo año tu deseo estará aquí esperándote... ¡y podrás guardar muchos más en cada cumpleaños! 🪐💫
        </div>

        <!-- FORMULARIO -->
        <div class="wish-form">
            <textarea id="wishInput" placeholder="Escribe tu deseo de cumpleaños para este año aquí... ✨"></textarea>
            <button class="btn-action" onclick="saveWish()">✨ Guardar Deseo en la Cápsula ✨</button>
            <button class="btn-download" onclick="downloadPdfBackup()">📄 Descargar Respaldo en PDF</button>
        </div>

        <!-- HISTORIAL -->
        <div class="history-title">>_ DESEOS_GUARDADOS.LOG</div>
        <div class="wishes-list" id="wishesList">
            <!-- Se cargan dinámicamente -->
        </div>
    </div>

    <div class="next-station" id="nextStationBtn">
        <button class="btn-next" onclick="location.href='estacion5.html'">Estación Final 🚀</button>
    </div>
<script>
    // --- 1. CREDENCIALES DE LA BASE DE DATOS EN LA NUBE ---
    const API_KEY = "$2a$10$OcnArItIiUfdvfgpsR.aieCpXbZu8FYJDDLNYjScfPIyY7DzmokjO"; 
    const BIN_ID = "6ad2d59cac6210605a38d89b"; 

    // --- 2. FUNCIONES DE CONEXIÓN CON JSONBIN.IO ---

    // Cargar deseos desde la nube
    async function cargarDeseosDeNube() {
        try {
            const respuesta = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                method: 'GET',
                headers: {
                    'X-Master-Key': API_KEY,
                    'X-Bin-Meta': 'false' // Devuelve directamente el array o contenido sin envoltorios extra
                }
            });
            if (!respuesta.ok) throw new Error("Error al consultar la API");
            const datos = await respuesta.json();
            return Array.isArray(datos) ? datos : (datos.record || []);
        } catch (error) {
            console.error("Error al cargar de la nube:", error);
            return [];
        }
    }

    // Guardar nuevo deseo en la nube (Sobrescribe la lista con el nuevo deseo agregado)
    async function guardarDeseosEnNube(listaActualizada) {
        try {
            const respuesta = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(listaActualizada)
            });
            if (!respuesta.ok) throw new Error("Error al guardar en la API");
            return await respuesta.json();
        } catch (error) {
            console.error("Error al guardar en la nube:", error);
        }
    }

    // --- 3. LOGICA DE INTERFAZ Y EVENTOS ---

    const formDeseo = document.getElementById('formDeseo');
    const inputDeseo = document.getElementById('inputDeseo');
    const contenedorDeseos = document.getElementById('contenedorDeseos');
    const btnGuardar = document.getElementById('btnGuardar');

    // Renderizar la lista de deseos en el HTML
    function mostrarDeseos(deseos) {
        if (!contenedorDeseos) return;
        contenedorDeseos.innerHTML = '';

        if (deseos.length === 0) {
            contenedorDeseos.innerHTML = '<p style="color: #94a3b8; font-style: italic;">No hay deseos en la cápsula aún. ¡Sé el primero en escribir uno! ✨</p>';
            return;
        }

        deseos.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'deseo-card';
            card.style.cssText = `
                background: rgba(15, 23, 42, 0.7);
                border: 1px solid rgba(56, 189, 248, 0.3);
                border-radius: 12px;
                padding: 12px 15px;
                margin-bottom: 12px;
                text-align: left;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            `;

            card.innerHTML = `
                <div style="font-size: 0.75rem; color: #f472b6; margin-bottom: 4px;">📅 ${item.date || 'Fecha estelar'}</div>
                <div style="font-size: 0.95rem; color: #f8fafc; line-height: 1.4;">${item.text}</div>
            `;
            contenedorDeseos.appendChild(card);
        });
    }

    // Cargar deseos automáticamente al entrar a la página
    async function inicializarCapsula() {
        if (contenedorDeseos) {
            contenedorDeseos.innerHTML = '<p style="color: #38bdf8;">Sincronizando con la red estelar... 🛰️</p>';
        }
        const deseos = await cargarDeseosDeNube();
        mostrarDeseos(deseos);
    }

    // Evento para enviar un nuevo deseo
    if (formDeseo) {
        formDeseo.addEventListener('submit', async (e) => {
            e.preventDefault();
            const texto = inputDeseo.value.trim();
            if (!texto) return;

            // Deshabilitar botón mientras guarda
            btnGuardar.disabled = true;
            btnGuardar.innerText = "Guardando en la nube... 🚀";

            // 1. Obtener los deseos actuales de la nube
            const deseosActuales = await cargarDeseosDeNube();

            // 2. Crear el objeto del nuevo deseo
            const hoy = new Date();
            const nuevoObjeto = {
                year: hoy.getFullYear(),
                date: hoy.toLocaleDateString('es-ES'),
                text: texto
            };

            // 3. Agregar el nuevo deseo a la lista
            deseosActuales.push(nuevoObjeto);

            // 4. Guardar la lista actualizada en JSONBin.io
            await guardarDeseosEnNube(deseosActuales);

            // 5. Limpiar input, restaurar botón y actualizar la pantalla
            inputDeseo.value = '';
            btnGuardar.disabled = false;
            btnGuardar.innerText = "Enviar a la Cápsula 🌌";

            mostrarDeseos(deseosActuales);
        });
    }

    // Cargar al iniciar la ventana
    window.addEventListener('DOMContentLoaded', inicializarCapsula);
</script>

</body>
</html>
