<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación 1: Nuestro Universo 3D</title>
    <style>
        body {
            background-color: #04060f;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* Canvas de fondo para las estrellas y partículas aleatorias */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .header-universe {
            position: absolute;
            top: 25px;
            text-align: center;
            z-index: 100;
        }
        h1 {
            color: #f472b6;
            font-family: cursive;
            font-size: 2.1rem;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.8);
            margin: 0;
        }
        p {
            color: #e2e8f0;
            font-size: 0.95rem;
            margin-top: 6px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        /* Contenedor principal 3D del Universo */
        .universe-container {
            position: relative;
            width: 320px;
            height: 320px;
            transform-style: preserve-3d;
            animation: rotateUniverse 30s linear infinite;
            z-index: 10;
        }

        @keyframes rotateUniverse {
            from { transform: rotateX(15deg) rotateY(0deg); }
            to { transform: rotateX(15deg) rotateY(360deg); }
        }

        /* Canvas del Corazón de Partículas en el Centro */
        .heart-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 0 15px #f472b6);
        }

        /* Órbitas de las fotos en 3D */
        .orbit-photo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
            transform-style: preserve-3d;
        }

        /* Botón inferior */
        .next-station {
            position: absolute;
            bottom: 30px;
            z-index: 100;
        }
        button {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <!-- Canvas para las partículas y estrellas de fondo -->
    <canvas id="bgCanvas"></canvas>

    <div class="header-universe">
        <h1>✨ Nuestro Universo ✨</h1>
        <p>En cualquier universo, siempre serías mi persona favorita 🌌</p>
    </div>

    <!-- Contenedor 3D Galaxia -->
    <div class="universe-container" id="universeContainer">
        <!-- Canvas donde se dibuja el corazón de partículas brillante -->
        <canvas id="heartCanvas" class="heart-canvas" width="200" height="200"></canvas>
    </div>

    <div class="next-station">
        <button onclick="location.href='estacion2.html'">Siguiente Estación 🚀</button>
    </div>

    <script>
        // --- 1. FONDO DE PARTÍCULAS Y ESTRELLAS ALEATORIAS ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        const bgStars = [];
        const totalBgStars = 120; // Cantidad de estrellas/partículas en el fondo

        for (let i = 0; i < totalBgStars; i++) {
            bgStars.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 2.2 + 0.5,
                // Mezcla de tonos rosados, magentas y blancos brillantes
                color: Math.random() > 0.4 ? 'rgba(255, 182, 193, ' : (Math.random() > 0.5 ? 'rgba(244, 114, 182, ' : 'rgba(255, 255, 255, '),
                alpha: Math.random(),
                speedAlpha: Math.random() * 0.02 + 0.005,
                vy: (Math.random() - 0.5) * 0.2 // Movimiento flotante muy sutil vertical
            });
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgStars.forEach(star => {
                star.alpha += star.speedAlpha;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.speedAlpha = -star.speedAlpha;
                }

                star.y += star.vy;
                if (star.y < 0) star.y = bgCanvas.height;
                if (star.y > bgCanvas.height) star.y = 0;

                bgCtx.fillStyle = star.color + star.alpha + ')';
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                bgCtx.fill();
            });

            requestAnimationFrame(animateBg);
        }
        animateBg();


        // --- 2. DISTRIBUCIÓN DE LAS 18 FOTOS EN ÓRBITA 3D ---
        const container = document.getElementById('universeContainer');
        const fotos = [
            "1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg", "6.jpg", "7.jpg", "8.jpg", "9.jpg",
            "10.jpeg", "11.jpeg", "12.jpeg", "13.jpeg", "14.jpeg", "15.jpeg", "16.jpeg", "17.jpeg", "18.jpeg"
        ];

        const radius = 180; 

        fotos.forEach((foto, index) => {
            const angle = (index / fotos.length) * (2 * Math.PI);
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            const img = document.createElement('img');
            img.src = foto;
            img.className = 'orbit-photo';
            img.alt = "Recuerdo";
            img.style.transform = `translate(-50%, -50%) translate3d(${x}px, 0px, ${z}px)`;

            container.appendChild(img);
        });


        // --- 3. ANIMACIÓN DEL CORAZÓN DE PARTÍCULAS EN EL CENTRO ---
        const heartCanvas = document.getElementById('heartCanvas');
        const ctx = heartCanvas.getContext('2d');

        function pointOnHeart(t) {
            return {
                x: 16 * Math.pow(Math.sin(t), 3),
                y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t))
            };
        }

        const particles = [];
        const numParticles = 180;

        for (let i = 0; i < numParticles; i++) {
            const step = (i / numParticles) * Math.PI * 2;
            const pos = pointOnHeart(step);
            particles.push({
                baseX: 100 + pos.x * 4.2,
                baseY: 95 + pos.y * 4.2,
                x: 100 + pos.x * 4.2,
                y: 95 + pos.y * 4.2,
                size: Math.random() * 2 + 1,
                alpha: Math.random() * 0.7 + 0.3,
            });
        }

        let time = 0;
        function drawHeartParticles() {
            ctx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);
            time += 0.04;
            
            const scale = 1 + Math.sin(time * 2) * 0.08;

            particles.forEach((p) => {
                const dx = (p.baseX - 100) * scale;
                const dy = (p.baseY - 95) * scale;
                p.x = 100 + dx + Math.sin(time + p.baseX) * 1.5;
                p.y = 95 + dy + Math.cos(time + p.baseY) * 1.5;

                ctx.fillStyle = `rgba(244, 114, 182, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(drawHeartParticles);
        }

        drawHeartParticles();
    </script>

</body>
</html>
