<style>
        html, body {
            background-color: #04060f;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            /* IMPORTANTE: Permite el scroll vertical en móviles */
            overflow-x: hidden;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            padding-bottom: 40px; /* Margen amplio para la barra de navegación del celular */
            box-sizing: border-box;
        }

        /* Canvas de estrellas en el fondo */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Encabezado */
        .header-station {
            text-align: center;
            z-index: 10;
            margin-bottom: 10px;
        }

        h1 {
            color: #f472b6;
            font-family: cursive;
            font-size: 2.1rem;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.8);
            margin: 0;
        }

        /* Contenedor principal */
        .stage-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95%;
            max-width: 600px;
        }

        /* --- COHETE HORIZONTAL --- */
        .rocket-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            height: 200px;
            margin-bottom: 10px;
            animation: floatHorizontal 3.5s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes floatHorizontal {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .rocket-body {
            position: absolute;
            top: 30px;
            left: 50px;
            width: 300px;
            height: 130px;
            background: linear-gradient(180deg, #3b82f6, #1e3a8a);
            border-radius: 20px 160px 160px 20px;
            border: 4px solid #38bdf8;
            box-shadow: inset 0 6px 12px rgba(255, 255, 255, 0.3), 0 0 25px rgba(56, 189, 248, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rocket-nose {
            position: absolute;
            top: 30px;
            right: 25px;
            width: 60px;
            height: 130px;
            background: #ef4444;
            border-radius: 0 160px 160px 0;
            border: 4px solid #f87171;
            border-left: none;
        }

        .rocket-window {
            width: 150px;
            height: 100px;
            border-radius: 18px;
            border: 4px solid #cbd5e1;
            box-shadow: 0 0 18px rgba(244, 114, 182, 0.9), inset 0 0 10px rgba(0,0,0,0.6);
            overflow: hidden;
            background: #000;
            z-index: 5;
            position: absolute;
            left: 115px;
            top: 45px;
        }

        .rocket-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .fin-top {
            position: absolute;
            top: 2px;
            left: 60px;
            width: 70px;
            height: 35px;
            background: #1e3a8a;
            border: 3px solid #38bdf8;
            transform: skewX(-30deg);
            border-radius: 8px 15px 0 0;
        }

        .fin-bottom {
            position: absolute;
            bottom: 2px;
            left: 60px;
            width: 70px;
            height: 35px;
            background: #1e3a8a;
            border: 3px solid #38bdf8;
            transform: skewX(30deg);
            border-radius: 0 0 15px 8px;
        }

        .rocket-flame {
            position: absolute;
            top: 60px;
            left: 0px;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #f472b6 0%, #fbbf24 60%, transparent 100%);
            border-radius: 50% 0 0 50%;
            filter: blur(4px);
            animation: flameBurn 0.15s infinite alternate;
        }

        @keyframes flameBurn {
            0% { transform: scaleX(0.8) translateX(8px); opacity: 0.8; }
            100% { transform: scaleX(1.4) translateX(0px); opacity: 1; }
        }

        /* Tarjeta de texto */
        .info-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(244, 114, 182, 0.4);
            border-radius: 15px;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.2);
            backdrop-filter: blur(8px);
            max-width: 420px;
            width: 90%;
            margin-top: 5px;
        }

        .info-card h2 {
            font-size: 1.1rem;
            color: #f472b6;
            margin: 0 0 6px 0;
            text-shadow: 0 0 8px rgba(244, 114, 182, 0.5);
        }

        .info-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin: 0;
            font-style: italic;
        }

        /* Botones de navegación */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 380px;
            margin-top: 15px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #f472b6, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.4);
            transition: transform 0.2s;
        }

        .nav-btn:hover {
            transform: scale(1.08);
        }

        /* Botón Siguiente Estación */
        .next-station {
            z-index: 10;
            margin-top: 25px;
            margin-bottom: 20px; /* Asegura espacio extra para deslizar */
        }

        .btn-next {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.5);
            transition: transform 0.2s;
        }

        .btn-next:hover {
            transform: scale(1.08);
        }
    </style>
