<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación 2: Somos como...</title>
    <style>
        html, body {
            background-color: #04060f;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px 10px;
        }

        /* ESTILOS PARA CELULAR (pantallas de menos de 768px) */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                overflow-y: auto !important;
            }
            body {
                justify-content: flex-start;
                padding-bottom: 50px;
            }
        }

        /* Canvas de estrellas en el fondo */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Encabezado */
        .header-station {
            text-align: center;
            z-index: 10;
            margin-bottom: 15px;
        }

        h1 {
            color: #f472b6;
            font-family: cursive;
            font-size: 2.1rem;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.8);
            margin: 0;
        }

        /* Contenedor principal */
        .stage-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95%;
            max-width: 600px;
        }

        /* --- COHETE HORIZONTAL --- */
        .rocket-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            height: 200px;
            margin-bottom: 10px;
            animation: floatHorizontal 3.5s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes floatHorizontal {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .rocket-body {
            position: absolute;
            top: 30px;
            left: 50px;
            width: 300px;
            height: 130px;
            background: linear-gradient(180deg, #3b82f6, #1e3a8a);
            border-radius: 20px 160px 160px 20px;
            border: 4px solid #38bdf8;
            box-shadow: inset 0 6px 12px rgba(255, 255, 255, 0.3), 0 0 25px rgba(56, 189, 248, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rocket-nose {
            position: absolute;
            top: 30px;
            right: 25px;
            width: 60px;
            height: 130px;
            background: #ef4444;
            border-radius: 0 160px 160px 0;
            border: 4px solid #f87171;
            border-left: none;
        }

        .rocket-window {
            width: 150px;
            height: 100px;
            border-radius: 18px;
            border: 4px solid #cbd5e1;
            box-shadow: 0 0 18px rgba(244, 114, 182, 0.9), inset 0 0 10px rgba(0,0,0,0.6);
            overflow: hidden;
            background: #000;
            z-index: 5;
            position: absolute;
            left: 115px;
            top: 45px;
        }

        .rocket-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .fin-top {
            position: absolute;
            top: 2px;
            left: 60px;
            width: 70px;
            height: 35px;
            background: #1e3a8a;
            border: 3px solid #38bdf8;
            transform: skewX(-30deg);
            border-radius: 8px 15px 0 0;
        }

        .fin-bottom {
            position: absolute;
            bottom: 2px;
            left: 60px;
            width: 70px;
            height: 35px;
            background: #1e3a8a;
            border: 3px solid #38bdf8;
            transform: skewX(30deg);
            border-radius: 0 0 15px 8px;
        }

        .rocket-flame {
            position: absolute;
            top: 60px;
            left: 0px;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #f472b6 0%, #fbbf24 60%, transparent 100%);
            border-radius: 50% 0 0 50%;
            filter: blur(4px);
            animation: flameBurn 0.15s infinite alternate;
        }

        @keyframes flameBurn {
            0% { transform: scaleX(0.8) translateX(8px); opacity: 0.8; }
            100% { transform: scaleX(1.4) translateX(0px); opacity: 1; }
        }

        /* Tarjeta de texto */
        .info-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(244, 114, 182, 0.4);
            border-radius: 15px;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.2);
            backdrop-filter: blur(8px);
            max-width: 420px;
            width: 90%;
            margin-top: 5px;
        }

        .info-card h2 {
            font-size: 1.1rem;
            color: #f472b6;
            margin: 0 0 6px 0;
            text-shadow: 0 0 8px rgba(244, 114, 182, 0.5);
        }

        .info-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin: 0;
            font-style: italic;
        }

        /* Botones de navegación */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 380px;
            margin-top: 15px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #f472b6, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.4);
            transition: transform 0.2s;
        }

        .nav-btn:hover {
            transform: scale(1.08);
        }

        /* Botón Siguiente Estación */
        .next-station {
            z-index: 10;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .btn-next {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0b0f19;
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.5);
            transition: transform 0.2s;
        }

        .btn-next:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- Encabezado -->
    <div class="header-station">
        <h1>✨ Somos como: ✨</h1>
    </div>

    <div class="stage-container">
        <!-- COHETE HORIZONTAL CON VENTANA RECTANGULAR -->
        <div class="rocket-wrapper">
            <div class="fin-top"></div>
            <div class="rocket-flame"></div>
            <div class="rocket-body"></div>
            <div class="rocket-nose"></div>
            <div class="rocket-window">
                <img id="animeImg" src="devilman.jpg" alt="Personajes">
            </div>
            <div class="fin-bottom"></div>
        </div>

        <!-- TARJETA CON TEXTO COMPACTO -->
        <div class="info-card">
            <h2 id="animePair">Ryo y Akira</h2>
            <p id="animeReason">"Porque incluso siendo opuestos, se eligieron en un mundo donde ninguno más podía comprenderlos."</p>
        </div>

        <!-- BOTONES DE NAVEGACIÓN -->
        <div class="controls">
            <button class="nav-btn" onclick="prevSlide()">◀ Anterior</button>
            <button class="nav-btn" onclick="nextSlide()">Siguiente ▶</button>
        </div>
    </div>

    <!-- BOTÓN DE SIGUIENTE ESTACIÓN -->
    <div class="next-station">
        <button class="btn-next" onclick="location.href='estacion3.html'">Siguiente Estación 🚀</button>
    </div>

    <script>
        // --- 1. FONDO DE ESTRELLAS Y PARTÍCULAS ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        const stars = [];
        for (let i = 0; i < 110; i++) {
            stars.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 2 + 0.5,
                color: Math.random() > 0.5 ? 'rgba(56, 189, 248, ' : 'rgba(244, 114, 182, ',
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
                bgCtx.fillStyle = s.color + s.alpha + ')';
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                bgCtx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- 2. DATOS DE LOS PERSONAJES ---
        const slides = [
            {
                img: "devilman.jpg",
                pair: "Ryo y Akira",
                reason: '"Porque incluso siendo opuestos, se eligieron en un mundo donde ninguno más podía comprenderlos."'
            },
            {
                img: "kazuybaji.jpg",
                pair: "Kazutora y Baji",
                reason: '"Porque Kazutora encontró en Baji a alguien que no lo reducía a sus errores, sino que seguía viendo en él al amigo que conocía."'
            },
            {
                img: "gojoygeto.jpg",
                pair: "Gojo y Geto",
                reason: '"Porque antes de ser los más fuertes, fueron dos chicos que podían ser débiles mientras estuvieran juntos."'
            },
            {
                img: "fullmetal.jpg",
                pair: "Edward y Alphonse",
                reason: '"Porque ni el precio más alto pudo hacer que uno dejara de luchar por devolverle al otro lo que perdió."'
            }
        ];

        let currentIndex = 0;

        function updateSlide() {
            const slide = slides[currentIndex];
            const imgElement = document.getElementById('animeImg');

            imgElement.style.opacity = 0;

            setTimeout(() => {
                imgElement.src = slide.img;
                document.getElementById('animePair').innerText = slide.pair;
                document.getElementById('animeReason').innerText = slide.reason;
                imgElement.style.opacity = 1;
            }, 200);
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slides.length;
            updateSlide();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            updateSlide();
        }
    </script>

</body>
</html>
